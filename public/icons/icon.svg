<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Viewfinder Frame -->
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 120 180 L 120 130 A 10 10 0 0 1 130 120 L 180 120" />
    <!-- Top-Right -->
    <path d="M 332 120 L 382 120 A 10 10 0 0 1 392 130 L 392 180" />
    <!-- Bottom-Left -->
    <path d="M 120 332 L 120 382 A 10 10 0 0 0 130 392 L 180 392" />
    <!-- Bottom-Right -->
    <path d="M 332 392 L 382 392 A 10 10 0 0 0 392 382 L 392 332" />
  </g>

  <!-- QR Center Elements -->
  <!-- Corner Box TL -->
  <rect x="160" y="160" width="64" height="64" rx="12" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="178" y="178" width="28" height="28" rx="6" fill="#ffffff" />

  <!-- Corner Box TR -->
  <rect x="288" y="160" width="64" height="64" rx="12" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="306" y="178" width="28" height="28" rx="6" fill="#ffffff" />

  <!-- Corner Box BL -->
  <rect x="160" y="288" width="64" height="64" rx="12" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="178" y="306" width="28" height="28" rx="6" fill="#ffffff" />

  <!-- Center Bit Grid -->
  <rect x="296" y="296" width="20" height="20" rx="4" fill="#a5b4fc" />
  <rect x="328" y="296" width="24" height="24" rx="5" fill="#ffffff" />
  <rect x="296" y="328" width="24" height="24" rx="5" fill="#ffffff" />
  <rect x="244" y="244" width="24" height="24" rx="5" fill="#38bdf8" />
  <rect x="244" y="172" width="20" height="40" rx="4" fill="#ffffff" />
  <rect x="172" y="244" width="40" height="20" rx="4" fill="#ffffff" />

  <!-- Laser Scanline -->
  <rect x="100" y="250" width="312" height="12" rx="6" fill="url(#laser)" filter="url(#glow)" />
</svg>
